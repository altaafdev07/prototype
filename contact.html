
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | NovaSpace</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="contact.css">
</head>
<body>
  <header>
    <a class="logo" href="index.html">NovaSpace<span>.</span></a>
    <nav>
      <a href="index.html">Home</a>
      <a href="portfolio.html">Portfolio</a>
      <a href="services.html">Services</a>
    </nav>
  </header>

  <main class="contact">
    <p class="tag">LET'S CONNECT</p>
    <h1>Have an <span>idea?</span></h1>
    <p class="description">
      Tell us what you're imagining. Let's make something
      extraordinary together.
    </p>

    <form id="contactForm">
      <label for="name">Your name</label>
      <input id="name" name="name" required placeholder="Alex Morgan">

      <label for="email">Email address</label>
      <input id="email" name="email" type="email"
        required placeholder="alex@example.com">

      <label for="subject">Subject</label>
      <select id="subject" name="subject">
        <option>General inquiry</option>
        <option>Website design</option>
        <option>Brand identity</option>
        <option>Other project</option>
      </select>

      <label for="message">Your message</label>
      <textarea id="message" name="message" rows="5"
        required placeholder="Tell us about your idea..."></textarea>

      <button class="send-btn" type="submit">Send message ↗</button>
      <p id="status" role="status"></p>
    </form>
  </main>

  <script src="form.js"></script>
</body>
</html>
